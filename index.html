<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Karyawan absEnQ</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/absensi-absEnQ/manifest.json">
  <meta name="theme-color" content="#800000">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/absensi-absEnQ/icon-192.png">
  <link rel="shortcut icon" href="/absensi-absEnQ/icon-192.png">
  <link rel="apple-touch-icon" href="/absensi-absEnQ/icon-192.png">

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Absensi">

  <!-- Android PWA -->
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'maroon': '#800000',
            'maroon-dark': '#5c0000',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    video, #canvas { object-fit: cover; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white transition">
  <div id="app"></div>

  <!-- POPUP INSTALL PWA -->
  <div id="installPopup" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center p-4 z-[999]">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
      <div class="w-20 h-20 bg-red-800 rounded-3xl mx-auto flex items-center justify-center mb-4 animate-bounce">
        <i class="fa-solid fa-download text-white text-3xl"></i>
      </div>
      <h3 class="text-xl font-black text-gray-900 dark:text-white mb-2">Install Aplikasi Dulu</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">Untuk absen, aplikasi harus diinstall ke HP kamu.</p>
      <button id="btnInstallAndroid" class="w-full bg-red-800 hover:bg-red-900 active:scale-95 text-white py-4 rounded-2xl font-bold text-lg shadow-xl transition">
        <i class="fa-solid fa-download mr-2"></i>Install Sekarang
      </button>
      <button id="btnIOS" class="hidden w-full bg-red-800 hover:bg-red-900 active:scale-95 text-white py-4 rounded-2xl font-bold text-lg shadow-xl transition mt-2">
        <i class="fa-solid fa-share-from-square mr-2"></i>Lihat Cara Install
      </button>
      <div id="iosSteps" class="hidden text-left text-sm text-gray-600 dark:text-gray-400 mt-4 space-y-2">
        <p>1. Tap tombol Share</p>
        <p>2. Pilih "Add to Home Screen"</p>
        <p>3. Buka dari Home Screen</p>
      </div>
      <p class="text-xs text-gray-500 mt-4">Ukuran cuma 2MB • Gratis</p>
    </div>
  </div>

  <!-- Load app.js -->
  <script src="app.js"></script>

  <!-- Modal Zoom Foto -->
  <div id="modalZoom" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-[9999]" onclick="tutupZoom()">
    <button class="absolute top-5 right-5 w-11 h-11 bg-white/20 rounded-full text-white text-3xl hover:bg-white/30 transition">&times;</button>
    <img id="imgZoom" class="max-w-full max-h-[90vh] rounded-2xl" onclick="event.stopPropagation()">
  </div>
  
  <script>
    function bukaZoom(url) {
      document.getElementById('imgZoom').src = url;
      document.getElementById('modalZoom').classList.remove('hidden');
      document.getElementById('modalZoom').classList.add('flex');
    }
    function tutupZoom() {
      document.getElementById('modalZoom').classList.add('hidden');
    }
  </script>
</body>
</html>
